name: iOS build

# Builds the iPhone app on a macOS runner. Without signing secrets it
# verifies the app compiles (unsigned). With them it produces a signed IPA
# and uploads it to TestFlight.
#
# Signing secrets: IOS_CERTIFICATE_P12_BASE64, IOS_CERTIFICATE_PASSWORD,
# IOS_PROVISIONING_PROFILE_BASE64, IOS_TEAM_ID, IOS_PROFILE_NAME, APPSTORE_ISSUER_ID, APPSTORE_API_KEY_ID,
# APPSTORE_API_PRIVATE_KEY. Plus SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'event-planner-agent/mobile/ios/**'
      - 'event-planner-agent/mobile/pubspec.yaml'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: event-planner-agent/mobile
    env:
      P12: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - run: flutter pub get
      - name: Unsigned build (compile check)
        if: env.P12 == ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: >
          flutter build ios --release --no-codesign
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
      - name: Install signing certificate and profile
        if: env.P12 != ''
        env:
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/wargakas.mobileprovision"
      - name: Configure manual signing
        if: env.P12 != ''
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          # The Runner target takes its settings from Release.xcconfig.
          {
            echo "CODE_SIGN_STYLE=Manual"
            echo "DEVELOPMENT_TEAM=$TEAM_ID"
            echo "PROVISIONING_PROFILE_SPECIFIER=$PROFILE_NAME"
            echo "CODE_SIGN_IDENTITY=Apple Distribution"
          } >> ios/Flutter/Release.xcconfig
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>io.wargakas.mobile</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          PLIST
      - name: Signed IPA
        if: env.P12 != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: >
          flutter build ipa --release
          --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          --dart-define=WARGAKAS_VERSION=${GITHUB_REF_NAME#v}
      - name: Upload to TestFlight
        if: env.P12 != ''
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: event-planner-agent/mobile/build/ios/ipa/wargakas_mobile.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
