name: Mobile CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore Flutter dependencies
        working-directory: event-planner-agent/mobile
        run: flutter pub get
      - name: Analyze Flutter code
        working-directory: event-planner-agent/mobile
        run: flutter analyze
      - name: Run Flutter tests
        working-directory: event-planner-agent/mobile
        run: flutter test
      - name: Run prototype model tests
        working-directory: event-planner-agent/prototype
        run: node cashbook-model.test.js
      - name: Build offline demo APK
        working-directory: event-planner-agent/mobile
        run: flutter build apk --debug --dart-define=WARGAKAS_APP_MODE=demo
