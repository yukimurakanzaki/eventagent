name: Mobile CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore Flutter dependencies
        working-directory: event-planner-agent/mobile
        run: flutter pub get
      - name: Analyze Flutter code
        working-directory: event-planner-agent/mobile
        run: flutter analyze
      - name: Run Flutter tests
        working-directory: event-planner-agent/mobile
        run: flutter test
      - name: Build web (participant viewer)
        working-directory: event-planner-agent/mobile
        run: flutter build web --release
      - name: Run prototype model tests
        working-directory: event-planner-agent/prototype
        run: node cashbook-model.test.js
      - name: Build offline demo APK
        working-directory: event-planner-agent/mobile
        run: flutter build apk --debug --dart-define=WARGAKAS_APP_MODE=demo

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations on plain PostgreSQL
        working-directory: event-planner-agent/supabase
        run: |
          psql -v ON_ERROR_STOP=1 -q -f tests/ci_stub_platform.sql
          for f in migrations/*.sql; do echo "== $f"; psql -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: Exercise sharing, late sponsor money and account deletion
        working-directory: event-planner-agent/supabase
        run: psql -v ON_ERROR_STOP=1 -f tests/ci_global_release_flow.sql
