name: Release APK and AAB

# Publish: git tag v1.1.1 && git push origin v1.1.1
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    defaults:
      run:
        working-directory: event-planner-agent/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # Keeps the Gradle distribution and dependencies between runs, so
          # an outage of the Gradle download server does not break builds.
          cache: gradle
          cache-dependency-path: |
            event-planner-agent/mobile/android/*.gradle*
            event-planner-agent/mobile/android/app/*.gradle*
            event-planner-agent/mobile/android/gradle/wrapper/gradle-wrapper.properties
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Tag must match pubspec version
        run: |
          v=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME != pubspec $v"; exit 1; }
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build hosted release APK and Play Store bundle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SHARE_BASE_URL: ${{ vars.WARGAKAS_SHARE_BASE_URL }}
        run: |
          defines="--dart-define=SUPABASE_URL=$SUPABASE_URL --dart-define=SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY --dart-define=WARGAKAS_VERSION=${GITHUB_REF_NAME#v}"
          if [ -n "$SHARE_BASE_URL" ]; then defines="$defines --dart-define=WARGAKAS_SHARE_BASE_URL=$SHARE_BASE_URL"; fi
          flutter build apk --release $defines
          flutter build apk --release --split-per-abi $defines
          flutter build appbundle --release $defines
      - name: Upload to Google Play (internal testing)
        if: env.PLAY_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.wargakas.mobile
          releaseFiles: event-planner-agent/mobile/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "wargakas-$GITHUB_REF_NAME.apk"
          cp build/app/outputs/bundle/release/app-release.aab "wargakas-$GITHUB_REF_NAME.aab"
          # Smaller download for most phones (64-bit ARM).
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "wargakas-$GITHUB_REF_NAME-arm64.apk"
          gh release create "$GITHUB_REF_NAME" "wargakas-$GITHUB_REF_NAME.apk" "wargakas-$GITHUB_REF_NAME-arm64.apk" "wargakas-$GITHUB_REF_NAME.aab" \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
